<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <style>
        body {
            background: linear-gradient(270deg, #23074d, #cc5333);
        }
    </style>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-3 fade-in-up">
        <div class="container">
          <a class="navbar-brand fs-1 text-white" href="/adminindex">Add a Movie</a>      
          <a href="/adminindex" class="btn btn-outline-light">Home</a>
        </div>
      </nav>
    <div class="container mt-4">
        <form action="/addmovie" method="post">
            <input type="hidden" name="id" value="{{MOVIE_ID}}" />
            <div class="mb-3">
                <label for="title" class="form-label">Movie Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="overview" class="form-label">Overview</label>
                <textarea class="form-control" id="overview" name="overview" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="rating" class="form-label">Rating</label>
                <input type="number" step="0.1" class="form-control" id="rating" name="rating" required>
            </div>
            <div class="mb-3">
                <label for="language">Language</label>
                <select class="form-control" id="language" name="language" onchange="toggleCustomLanguage()">
                    {{LANGUAGE_OPTIONS}}
                    <option value="custom">Custom</option>
                </select>
                <input type="text" id="customLanguage" name="customLanguage" class="form-control mt-2" placeholder="Enter 2-letter language code" style="display:none;" pattern="[a-zA-Z]{2}" />
            </div>
            <div class="mb-3">
                <label for="releaseDate" class="form-label">Release Date</label>
                <input type="date" class="form-control" id="releaseDate" name="releaseDate" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
        <a href="/adminindex" class="btn btn-secondary mt-3">Back to Admin Dashboard</a>
    </div>
    <script>
        function toggleCustomLanguage() {
            var select = document.getElementById("language");
            var customInput = document.getElementById("customLanguage");
            customInput.style.display = select.value === "custom" ? "block" : "none";
        }
    </script>
</body>
</html>
