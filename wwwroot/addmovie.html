<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-3">
        <div class="container-fluid px-5">
            <a class="navbar-brand fs-3" href="/adminindex">🎬 Add a Movie</a>
            <a href="/adminindex" class="btn btn-outline-light">🏠 Home</a>
        </div>
    </nav>

    <div class="container">
        <form action="/addmovie" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title">Movie Title</label>
                <input type="text" class="form-control" id="title" name="title" required />
            </div>

            <div class="mb-3">
                <label for="overview">Overview</label>
                <textarea class="form-control" id="overview" name="overview" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label for="releaseDate">Release Date</label>
                <input type="date" class="form-control" id="releaseDate" name="releaseDate" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Poster Image</label><br>
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" name="posterOption" value="upload" checked onchange="togglePosterInput()">
                    <label class="form-check-label">Upload</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" name="posterOption" value="link" onchange="togglePosterInput()">
                    <label class="form-check-label">Link</label>
                </div>

                <div id="uploadDiv" class="mt-2">
                    <input type="file" class="form-control" name="posterUpload" accept="image/*" onchange="previewPoster(event)">
                </div>

                <div id="linkDiv" class="mt-2" style="display: none;">
                    <input type="text" class="form-control" name="posterLink" placeholder="Enter image URL" oninput="previewLink(event)">
                </div>

                <div class="mt-3 text-center">
                    <img id="posterPreview" src="#" alt="Poster Preview" class="img-fluid rounded shadow" style="max-width: 200px; display: none;" />
                </div>
            </div>

            <div class="mb-3">
                <label for="rating">User Rating</label>
                <input type="number" step="0.1" class="form-control" id="rating" name="rating" required />
            </div>

            <div class="mb-3">
                <label for="genres">Genres</label>
                <input type="text" class="form-control" id="genres" name="genres" required />
            </div>

            <div class="mb-3">
                <label for="language">Language</label>
                <select class="form-control" id="language" name="language" onchange="toggleCustomLanguage()">
                    {{LANGUAGE_OPTIONS}}
                    <option value="custom">Custom</option>
                </select>
                <input type="text" id="customLanguage" name="customLanguage" class="form-control mt-2" placeholder="Enter 2-letter language code" style="display:none;" pattern="[a-zA-Z]{2}" />
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-light px-5 mt-2">➕ Add Movie</button>
            </div>
        </form>
    </div>
      <script src="addedit.js"></script>      
</body>
</html>
