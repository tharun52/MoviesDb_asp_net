<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MovieDb</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <link rel="stylesheet" href="./style.css">
    <style>
  
    </style>
  </head>
  <body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-3 fade-in-down">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fs-1 text-white" href="/">MovieDb</a>
        <a href="/adminlogin" class="btn btn-outline-light">Admin Login</a>
      </div>
    </nav>


   <!-- Main Content -->
   <div class="container py-4 fade-in">
    <!-- Search & Sort Controls -->
    <div class="row g-3 mb-4 align-items-center">
      <div class="col-md-6">
        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search movies..." value="{{SEARCH_TERM}}"/>
      </div>
      <div class="col-md-3">
        <select id="sortBy" class="form-select form-select-lg">
          <option value="title" selected>Sort by Title</option>
          <option value="releasedate">Sort by Release Date</option>
          <option value="rating">Sort by Rating</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="orderBy" class="form-select form-select-lg">
          <option value="asc" selected>Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </div>
    </div>
  
    <!-- Movie Grid -->
    <div id="movieGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      {{MOVIES}}
    </div>
  
    <script src="indexscript.js"></script>
  </body>
</html>
