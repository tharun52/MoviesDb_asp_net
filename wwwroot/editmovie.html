<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <style>
        body {
            background: linear-gradient(270deg, #23074d, #cc5333);
        }
    </style>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-3 fade-in-up">
        <div class="container">
          <a class="navbar-brand fs-1 text-white" href="/adminindex">Edit  <span class="text-warning">{{MOVIE_TITLE}}</span></a>      
          <a href="/admindex" class="btn btn-outline-light">Home</a>
        </div>
      </nav>
    <div class="container mt-4">
        <form action="/editmovie" method="post">
            <input type="hidden" name="id" value="{{MOVIE_ID}}" />
            <div class="mb-3">
                <label for="title" class="form-label">Movie Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{MOVIE_TITLE}}" required>
            </div>
            <div class="mb-3">
                <label for="overview" class="form-label">Overview</label>
                <textarea class="form-control" id="overview" name="overview" rows="3" required>{{MOVIE_OVERVIEW}}</textarea>
            </div>
            <div class="mb-3">
                <label for="rating" class="form-label">Rating</label>
                <input type="number" step="0.1" class="form-control" id="rating" name="rating" value="{{MOVIE_RATING}}" required>
            </div>
            <div class="mb-3">
                <label for="language" class="form-label">Language</label>
                <select class="form-select" id="language" name="languageSelect" onchange="toggleCustomInput()" required>
                    {{LANGUAGE_OPTIONS}}
                    <option value="custom">Custom</option>
                </select>
            </div>
            
            <div class="mb-3 d-none" id="customLanguageDiv">
                <label for="customLanguage" class="form-label">Enter 2-letter Language Code</label>
                <input type="text" class="form-control" id="customLanguage" name="language" pattern="[a-zA-Z]{2}" title="Enter 2-letter language code">
            </div>
            
            
            <div class="mb-3">
                <label for="releaseDate" class="form-label">Release Date</label>
                <input type="date" class="form-control" id="releaseDate" name="releaseDate" value="{{MOVIE_RELEASEDATE}}" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
        <a href="/adminindex" class="btn btn-secondary mt-3">Back to Admin Dashboard</a>
    </div>

    <script>
        function toggleCustomInput() {
            const select = document.getElementById('language');
            const customDiv = document.getElementById('customLanguageDiv');
            const customInput = document.getElementById('customLanguage');

            if (select.value === 'custom') {
                customDiv.classList.remove('d-none');
                customInput.required = true;
            } else {
                customDiv.classList.add('d-none');
                customInput.required = false;
            }
        }

    </script>
</body>
</html>
